# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# Power
CONFIG_ZMK_IDLE_TIMEOUT=30000 # default: 30000 ms
CONFIG_ZMK_SLEEP=y # default: n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000 # default: 900000 ms

# Battery level reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y # default: n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y # default: n

# Mouse support
CONFIG_ZMK_POINTING=y # default: n
