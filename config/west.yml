manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: swapper
      url-base: https://github.com/caksoylar
    - name: urob
      url-base: https://github.com/urob
  projects:
    - name: zmk
      remote: zmkfirmware
      # revision: v0.3 # avoid compatibility break
      # TODO: Try build main eventually
      revision: main
      import: app/west.yml

    - name: zmk-smart-toggle
      remote: swapper
      revision: main

    - name: zmk-auto-layer
      remote: urob
      revision: main # Should match ZMK release.
  self:
    path: config
